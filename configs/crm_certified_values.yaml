# =====================================================================
# crm_certified_values.yaml
# Dickson CO2-in-seawater Certified Reference Material (CRM) values
# =====================================================================
#
# AUDIT FIX N-1 (CRITICAL, scientific data integrity)
# ---------------------------------------------------------------------
# This file replaces the hardcoded CRM_CERTIFIED_TA dictionary that
# previously lived inside qc_ta_ph.py. Seven of the eight values that
# were hardcoded there were FABRICATED ("illustrative starting points")
# and disagreed with the real Dickson certificates by up to ~50 umol/kg
# — catastrophic when the TA QC tolerance is ~1-2 umol/kg, because the
# certified value is subtracted from the measured CRM to set the
# correction applied to EVERY sample's TA.
#
# All total_alkalinity_umol_kg values below are transcribed from the
# authoritative NOAA OCADS batch table (verified 2026-05-29):
#   https://www.ncei.noaa.gov/access/ocean-carbon-acidification-data-system/oceans/Dickson_CRM/batches.html
# Individual batch certificates (PDF) are linked from that page under
#   .../Dickson_CRM/rmdata/BatchNN.pdf
#
# IMPORTANT OPERATIONAL RULES
# ---------------------------------------------------------------------
# 1. Only add a batch here after transcribing its value from the actual
#    certificate for YOUR bottle lot. Do NOT interpolate or guess.
# 2. The pipeline loader (load_crm_certified_values) will die() if a
#    requested batch is absent. This is intentional: a hard stop is far
#    safer than silently applying a wrong or fabricated value.
# 3. If you have a certificate the table here does not cover, either add
#    it here (with source + date) or pass crm_ta_override at the call
#    site with the exact certified value from your certificate.
#
# Dickson certification reproducibility is < 1 umol/kg and accuracy
# within 2 umol/kg (Dickson, Afghan & Anderson 2003, Marine Chemistry
# 80:185-197). GOA-ON / WMO TA data-quality objectives are 2 / 1 umol/kg
# (GOA-ON 2019; WMO 2022).
# =====================================================================

config_type: crm_certified_values
schema_version: 1
source:
  authority: NOAA OCADS — Dickson CO2 CRM batch table
  url: https://www.ncei.noaa.gov/access/ocean-carbon-acidification-data-system/oceans/Dickson_CRM/batches.html
  retrieved_utc: "2026-05-29"
  unit: umol kg-1
  notes: >
    Certified Total Alkalinity values transcribed from the NOAA OCADS
    batch table. Salinity is included for traceability. Always confirm
    against the per-batch certificate PDF for the specific bottle lot.

