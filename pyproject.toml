# =====================================================================
# oa_pipeline -- pyproject.toml
# =====================================================================
# Packages the OA pipeline as a real Python package under:
#
#     src/oa_pipeline/
#
# After installation with:
#
#     python -m pip install -e .
#
# modules can be imported from any working directory, for example:
#
#     from oa_pipeline.stage4 import add_readiness_status
#
# This project uses a src layout. Do not use flat py-modules with this
# codebase because the package modules use relative imports such as:
#
#     from .common import ...
# =====================================================================

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "oa-pipeline"
version = "0.1.0"
description = "Ocean acidification quality control and processing pipeline"
readme = "README.md"
license = { file = "LICENSE" }

authors = [
    { name = "Prof. R. Mahu" },
    { name = "Maurice Oti Edusei" },
]

keywords = [
    "ocean acidification",
    "carbonate chemistry",
    "data preprocessing",
    "quality control",
    "reproducibility",
    "FAIR data",
    "marine science",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Oceanography",
]

requires-python = ">=3.10"

dependencies = [
    "pandas>=2.2,<3.1",
    "numpy>=1.26,<2.5",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.8,<4.0",
]


[project.optional-dependencies]
# Parquet output support.
parquet = [
    "pyarrow>=10.0,<20.0",
]

# YAML configuration file support.
yaml = [
    "pyyaml>=6.0,<7.0",
]

# Better markdown tables in reports.
tables = [
    "tabulate>=0.9,<0.11",
]

# Notebook runner support for run_pipeline.sh.
runner = [
    "papermill>=2.4,<3.0",
]

# Test suite.
test = [
    "pytest>=8.0,<10.0",
]

# Interactive notebook editing.
notebook = [
    "ipykernel>=6.0,<8.0",
    "ipython>=8.0,<10.0",
]

# Development convenience install.
dev = [
    "pyarrow>=10.0,<20.0",
    "pyyaml>=6.0,<7.0",
    "tabulate>=0.9,<0.11",
    "papermill>=2.4,<3.0",
    "pytest>=8.0,<10.0",
    "ipykernel>=6.0,<8.0",
    "ipython>=8.0,<10.0",
]

# Convenience: install all optional runtime, runner, test, and notebook tools.
all = [
    "pyarrow>=10.0,<20.0",
    "pyyaml>=6.0,<7.0",
    "tabulate>=0.9,<0.11",
    "papermill>=2.4,<3.0",
    "pytest>=8.0,<10.0",
    "ipykernel>=6.0,<8.0",
    "ipython>=8.0,<10.0",
]


[project.urls]
Homepage = "https://github.com/your-org/oa_pipeline"
Documentation = "https://github.com/your-org/oa_pipeline#readme"
Issues = "https://github.com/your-org/oa_pipeline/issues"


# =====================================================================
# Setuptools configuration -- src/oa_pipeline package
# =====================================================================

[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = ["oa_pipeline*"]


# =====================================================================
# Pytest configuration
# =====================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# This lets pytest import oa_pipeline directly from src/ even before
# editable install is fully recognised by the current shell/session.
pythonpath = ["src"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

filterwarnings = [
    "default::FutureWarning",
    "default::DeprecationWarning",
]